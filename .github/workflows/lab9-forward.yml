name: Vantex lab 9 forward (locked day-2 paper test, daily after close)
on:
  schedule:
    - cron: '17 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-lab9-forward
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Replay every completed day-1/day-2 pair after 2026-11-13 with the frozen rule (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
          GH_TOKEN: ${{ github.token }}
        run: python lab9.py forward
