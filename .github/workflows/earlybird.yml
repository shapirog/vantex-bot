name: Vantex Early Bird (tiny-float alerts 3-9:30 AM, no trading)
on:
  schedule:
    # times are UTC (winter): 7:30 = 2:30 AM Eastern (watch list, then a scan every minute until 7:55 AM),
    # 12:50 = 7:50 AM Eastern (takes over at 7:55 and scans every minute until 9:30 AM)
    - cron: '30 7 * * 1-5'
    - cron: '50 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Type 1 for a single test scan right now; type 0 to start the normal every-minute loop'
        default: '1'
permissions:
  contents: write
concurrency:
  group: vantex-earlybird
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Early Bird scan (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          EB_FORCE: ${{ github.event.inputs.force }}
        run: python earlybird.py
