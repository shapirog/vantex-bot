name: Vantex Early Bird (tiny-float alerts 3 AM-4 PM, no trading)
on:
  schedule:
    # Each run starts the next one itself (relay), Sunday 6 PM -> Friday 4 PM Eastern.
    # These schedules are only backups that restart the relay if it ever breaks (times are UTC, winter):
    - cron: '7 23 * * 0'      # Sunday 6:07 PM Eastern: starts the week
    - cron: '30 7 * * 1-5'    # 2:30 AM Eastern
    - cron: '50 12 * * 1-5'   # 7:50 AM Eastern
    - cron: '50 17 * * 1-5'   # 12:50 PM Eastern
  workflow_dispatch:
    inputs:
      force:
        description: 'Type 1 for a single test scan right now; type 0 to start the normal every-minute loop'
        default: '1'
permissions:
  contents: write
  actions: write
concurrency:
  group: vantex-earlybird
  cancel-in-progress: false      # a new run waits for the current one, so there is never more than one
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Early Bird scan (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          EB_FORCE: ${{ github.event.inputs.force }}
        run: python earlybird.py
