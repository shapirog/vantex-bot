name: Vantex lab 8 forward (locked paper test, daily after close)
on:
  schedule:
    - cron: '47 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-lab8-forward
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Replay every completed session after 2026-11-13 with the frozen rule (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
          GH_TOKEN: ${{ github.token }}
        run: python lab8.py forward
