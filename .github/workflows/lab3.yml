name: Vantex strategy lab 3 (audit)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-lab3
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Audit lab 2 and run the pre-registered tests (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python lab3.py
