name: Vantex paper trading
on:
  schedule:
    - cron: '15 13 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vantex-trading
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Run bot (paper account only)
        id: bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python bot.py loop 330
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Save trading log
        if: always()
        run: |
          git config user.name "vantex-bot"
          git config user.email "vantex-bot@users.noreply.github.com"
          git add logs || true
          git commit -m "Trading log $(date -u +%F)" && git pull --rebase && git push || true
      - name: Hand off to a fresh run if the market is still open
        if: steps.bot.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run trade.yml --ref main
