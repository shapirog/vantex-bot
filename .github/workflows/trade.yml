name: Vantex paper trading
on:
  schedule:
    # Several staggered starts (UTC), off the busy top of the hour, so a skipped or late
    # GitHub schedule can't keep the bot offline. Covers the 9:30 AM ET open in both EST and EDT.
    # Extra runs simply wait in the queue; the bot never trades twice on the same signal.
    - cron: '7 12 * * 1-5'
    - cron: '41 12 * * 1-5'
    - cron: '13 13 * * 1-5'
    - cron: '47 13 * * 1-5'
    - cron: '9 14 * * 1-5'
    - cron: '23 14 * * 1-5'
    - cron: '52 14 * * 1-5'
    - cron: '37 15 * * 1-5'
    - cron: '37 16 * * 1-5'
    - cron: '37 17 * * 1-5'
    - cron: '37 18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vantex-trading
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Run bot (paper account only)
        id: bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python bot.py loop 330
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Save trading log
        if: always()
        run: |
          git config user.name "vantex-bot"
          git config user.email "vantex-bot@users.noreply.github.com"
          git add logs || true
          git commit -m "Trading log $(date -u +%F)" && git pull --rebase && git push || true
      - name: Hand off to a fresh run if the market is still open
        if: steps.bot.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run trade.yml --ref main
