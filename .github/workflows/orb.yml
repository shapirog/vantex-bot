name: Vantex City ORB strategy test
on:
  workflow_dispatch:
    inputs:
      split:
        description: 'dev (Jun-Sep 2026) or test (untouched Oct-Nov, run once at the end)'
        required: true
        default: 'dev'
        type: choice
        options: ['dev', 'test']
      sessions:
        description: 'number of sessions to sample'
        required: false
        default: '20'
permissions:
  contents: write
concurrency:
  group: vantex-city-replay
  cancel-in-progress: false
jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pytest
      - run: python -m pytest -q tests
      - name: ORB test (read-only, places no orders)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ inputs.split }}
          SESSIONS: ${{ inputs.sessions }}
        run: python city_orb.py "$SPLIT" "$SESSIONS"
