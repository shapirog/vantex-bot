name: Vantex strategy lab 6 (low float test)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-lab6
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - name: Test the pre-registered low-float rule on lab 5's trades (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
          GH_TOKEN: ${{ github.token }}
        run: python lab6.py
