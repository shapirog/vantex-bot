name: Vantex City research - social buzz collector
on:
  schedule:
    - cron: '7,37 12-21 * * 1-5'
    - cron: '7 0,4,8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-social
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Snapshot (read-only, places no orders)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python city_social.py
