name: Vantex journal and scorecard
on:
  schedule:
    - cron: '17,47 * * * *'   # every 30 minutes, every day (crypto trades on weekends too)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-journal
  cancel-in-progress: true
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build journal and scorecard (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python journal.py
