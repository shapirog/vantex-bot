name: Vantex market scanner
on:
  schedule:
    # every 15 minutes, weekdays, about 4 AM to 8 PM Eastern (pre-market through after-hours)
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vantex-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Scan the market (read-only, places no trades)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: python scanner.py
