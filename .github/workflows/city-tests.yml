name: Vantex City tests
on:
  push:
    paths: ['vantex_core.py', 'city_broker.py', 'city_engine.py', 'city_replay.py', 'tests/**', 'hq.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pytest
      - run: python -m pytest -v tests
