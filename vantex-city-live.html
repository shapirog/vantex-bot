@keyframes hue{to{filter:hue-rotate(360deg)}}

@keyframes tz{50%{opacity:.05}}
.bm{width:5px;border-radius:3px;mix-blend-mode:screen;animation:fl 1.3s steps(1) infinite}

@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(1180px)}}
.hd{transform-origin:50% 92%;animation:hd 6s ease-in-out infinite;-webkit-mask-image:radial-gradient(closest-side,#000 74%,transparent);mask-image:radial-gradient(closest-side,#000 74%,transparent)}
@keyframes hd{0%,100%{transform:rotate(-2.5deg) translateX(-2px)}40%{transform:rotate(2.5deg) translateX(3px)}70%{transform:rotate(0) translateY(1px)}}
.nod{animation:nod .7s!important}
@keyframes nod{40%{transform:translateY(7px)}}
.bd{transform-origin:50% 100%;animation:bd 4s ease-in-out infinite;-webkit-mask-image:radial-gradient(ellipse closest-side,#000 80%,transparent);mask-image:radial-gradient(ellipse closest-side,#000 80%,transparent)}
@keyframes bd{50%{transform:scaleY(1.014) rotate(.5deg)}}
.stm{width:6px;height:26px;border-radius:3px;background:linear-gradient(#cfeaff,transparent);animation:stm 2.4s ease-in infinite;opacity:0}
@keyframes stm{0%{opacity:.7;transform:translateY(8px)}100%{opacity:0;transform:translateY(-22px) translateX(6px)}}
.sp{width:5px;height:5px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc);animation:sp 1.5s infinite;opacity:0}
@keyframes sp{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}

@keyframes bu{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.bl{animation:bl 1.4s steps(1) infinite}
@keyframes bl{50%{opacity:.4}}
.rs{animation:rot 11s linear infinite}.rs2{animation:rot 16s linear infinite reverse}
