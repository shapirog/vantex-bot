<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vantex City">
<title>Vantex City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--night:#06051a;--panel:rgba(12,10,40,.88);--line:rgba(120,110,255,.28);--ink:#e9e7ff;--dim:#9a96cf;--call:#3dffa8;--put:#ff3d71;--vwap:#ffc94d;--ema:#4dd8ff;--violet:#8b7bff;--display:"Chakra Petch",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--night);color:var(--ink);font:13px var(--mono);-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}.hud *{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:18px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:linear-gradient(var(--night),transparent)}
.brand{font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.badge{font:600 10px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.live{color:var(--call)}.stale{color:var(--vwap)}
.clock{display:flex;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums}.clock .t{color:var(--dim);font-size:12px}.clock .pnl{font:700 20px var(--display)}
.board{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 86px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:150px}
h3{margin:0 0 6px;font:700 10px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}.board li{display:grid;grid-template-columns:14px 1fr auto;gap:6px;cursor:pointer;padding:2px 0;font-variant-numeric:tabular-nums}.board .n{color:var(--dim)}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom) + 8px);padding-top:16px;background:linear-gradient(transparent,var(--night))}
.tape{white-space:nowrap;overflow:hidden;font-size:11px;color:var(--dim);display:flex;gap:18px}.tape b{font-weight:600}.hint{font-size:11px;color:var(--dim);margin-bottom:4px}
.up{color:var(--call)}.dn{color:var(--put)}
button{font:600 11px var(--mono);color:var(--ink);background:rgba(30,24,80,.8);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
.sheet{position:fixed;z-index:10;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--violet);border-radius:14px 14px 0 0;padding:14px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px,env(safe-area-inset-left));transform:translateY(105%);transition:transform .28s}
.sheet.open{transform:none}
@media(min-width:900px){.sheet{left:auto;top:0;width:420px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--violet);transform:translateX(105%)}}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sheet h2{margin:0;font:700 22px var(--display)}.sheet header button{margin-left:auto}
.chip{font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 7px;border-radius:99px;border:1px solid currentColor;text-transform:uppercase}

#chart{width:100%;height:200px;display:block}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:var(--dim);margin-top:4px}.legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.meter{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:6px}.meter div{height:100%;width:0;transition:width .4s}
.log{list-style:none;margin:0;padding:0;font-size:11.5px;display:grid;gap:3px}.log li{display:grid;grid-template-columns:62px 1fr;gap:6px}.tm{color:var(--dim)}
.wait{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-width:320px;text-align:center;line-height:1.5}
</style></head><body>
<canvas id="scene"></canvas>
<div class="hud top">
  <div class="brand">Vantex City <span id="badge" class="badge stale">CONNECTING</span></div>

</div>

</section>

<script>
(()=>{
const REPO=(location.hostname.endsWith('github.io')?location.hostname.split('.')[0]+'/'+(location.pathname.split('/')[1]||'vantex-bot'):'shapirog/vantex-bot');
const URL_STATE=`https://api.github.com/repos/${REPO}/contents/state.json?ref=live`;
const SYMS=['QQQ','AAPL','NVDA','AMZN','GOOGL','TSLA','MSFT'];
const $=id=>document.getElementById(id);
const money=n=>(n<0?'-':n>0?'+':'')+'$'+Math.abs(Math.round(n||0)).toLocaleString('en-US');
const tl=k=>{const m=570+k,h=Math.floor(m/60);return (h>12?h-12:h)+':'+String(m%60).padStart(2,'0')};
const hhmm=ts=>{const d=new Date(ts);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})};
let S=null,seen=new Set(),first=true,openSym=null;

/* ---------- 3D ---------- */
const canvas=$('scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06051a);scene.fog=new THREE.Fog(0x06051a,40,110);
const camera=new THREE.PerspectiveCamera(50,1,.1,300),controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(0,4,0);controls.enableDamping=true;controls.maxPolarAngle=1.42;controls.minDistance=10;controls.maxDistance=80;controls.autoRotate=true;controls.autoRotateSpeed=.35;
let composer=null;if(THREE.EffectComposer&&THREE.UnrealBloomPass){composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(256,256),.95,.45,.5))}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function winTex(lit,base,seed){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d'),r=rng(seed);g.fillStyle=base;g.fillRect(0,0,64,128);for(let y=4;y<124;y+=8)for(let x=4;x<60;x+=8)if(r()<.55){g.fillStyle=lit[Math.floor(r()*lit.length)];g.globalAlpha=.5+r()*.5;g.fillRect(x,y,4,4)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshBasicMaterial({color:0x0b0930}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(240,120,0x3a2fb0,0x221a7a);grid.position.y=.01;scene.add(grid);
const ringMat=c=>new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide,transparent:true,opacity:.9});
[[13,13.25,0x4dd8ff],[4.2,4.35,0x8b7bff]].forEach(([a,b,c])=>{const m=new THREE.Mesh(new THREE.RingGeometry(a,b,96),ringMat(c));m.rotation.x=-Math.PI/2;m.position.y=.03;scene.add(m)});
{const N=520,geo=new THREE.BoxGeometry(1,1,1);geo.translate(0,.5,0);const m=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({map:winTex(['#6b5cff','#4dd8ff','#ff4dd2','#fff'],'#120d3a',7)}),N),d=new THREE.Object3D(),r=rng(99);for(let k=0;k<N;k++){const a=r()*Math.PI*2,R=17+Math.pow(r(),.7)*50;d.position.set(Math.cos(a)*R,0,Math.sin(a)*R);d.scale.set(1+r()*2.2,1+r()*r()*14,1+r()*2.2);d.rotation.y=r()*Math.PI;d.updateMatrix();m.setMatrixAt(k,d.matrix)}scene.add(m)}
function makeLabel(w=320,h=150){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c),s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.userData={c,t,key:''};return s}
function drawLabel(s,lines,border){const key=JSON.stringify(lines)+border;if(s.userData.key===key)return;s.userData.key=key;const{c,t}=s.userData,g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='rgba(8,6,30,.82)';g.strokeStyle=border;g.lineWidth=4;const r=14,w=c.width-8,h=c.height-8;g.beginPath();g.moveTo(4+r,4);g.arcTo(4+w,4,4+w,4+h,r);g.arcTo(4+w,4+h,4,4+h,r);g.arcTo(4,4+h,4,4,r);g.arcTo(4,4,4+w,4,r);g.fill();g.stroke();g.textAlign='center';let y=0;for(const[txt,size,col,f]of lines){y+=size+8;g.font=`${f||'700'} ${size}px "Chakra Petch",sans-serif`;g.fillStyle=col;g.fillText(txt,c.width/2,y+4)}t.needsUpdate=true}
const vault=new THREE.Group();scene.add(vault);
{const dome=new THREE.Mesh(new THREE.SphereGeometry(2.2,40,20,0,Math.PI*2,0,Math.PI/2),new THREE.MeshBasicMaterial({color:0xfff1d6}));dome.position.y=1;vault.add(dome);const base=new THREE.Mesh(new THREE.CylinderGeometry(2.6,3,1,40),new THREE.MeshBasicMaterial({map:winTex(['#ffc94d','#ff4dd2'],'#2a1240',3)}));base.position.y=.5;vault.add(base)}
const vaultLabel=makeLabel(420,150);vaultLabel.scale.set(6.3,2.25,1);vaultLabel.position.y=5.6;vault.add(vaultLabel);
const CALL=new THREE.Color(0x3dffa8),PUT=new THREE.Color(0xff3d71),IDLE=new THREE.Color(0x8b7bff);
const towers={},pick=[];
SYMS.forEach((sym,k)=>{const a=-Math.PI/2+k*2*Math.PI/SYMS.length,R=9.4;const g=new THREE.Group();g.position.set(Math.cos(a)*R,0,Math.sin(a)*R);scene.add(g);
  const tex=winTex(['#4dd8ff','#8b7bff','#fff','#3dffa8'],'#0f0b38',k*13+1);let y=0;
  [[2.2,3.2],[1.6,3],[1.1,2.6]].forEach(([w,h])=>{const t=tex.clone();t.needsUpdate=true;t.repeat.set(w/1.2,h/1.6);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshBasicMaterial({map:t}));m.position.y=y+h/2;m.userData.sym=sym;g.add(m);pick.push(m);const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x4dd8ff,transparent:true,opacity:.7}));e.position.copy(m.position);g.add(e);y+=h});
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(.05,.12,2,8),new THREE.MeshBasicMaterial({color:0xffffff}));sp.position.y=y+1;g.add(sp);const top=y+2;
  const pad=new THREE.Mesh(new THREE.RingGeometry(1.9,2.05,48),ringMat(0x8b7bff));pad.rotation.x=-Math.PI/2;pad.position.y=.04;g.add(pad);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,60,16,1,true),new THREE.MeshBasicMaterial({color:0x3dffa8,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));beam.position.y=top+30;g.add(beam);
  const halo=new THREE.Mesh(new THREE.TorusGeometry(.9,.06,8,40),new THREE.MeshBasicMaterial({color:0x3dffa8,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));halo.rotation.x=Math.PI/2;halo.position.y=top;g.add(halo);
  const label=makeLabel();label.scale.set(4,1.88,1);label.position.y=top+2.2;g.add(label);
  const hit=new THREE.Mesh(new THREE.BoxGeometry(3.4,top+3,3.4),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=(top+3)/2;hit.userData.sym=sym;g.add(hit);pick.push(hit);
  towers[sym]={g,beam,halo,label,charge:0,target:0,fire:0,col:new THREE.Color(0x8b7bff),want:IDLE.clone(),side:null};
});

/* ---------- state → visuals ---------- */
function info(sym){
  const d=S&&S.symbols[sym];if(!d||d.error)return{status:'NO DATA',color:'#9a96cf',charge:0,side:null,text:'No data yet'};
  if(d.qty>0)return{status:'IN LONG',color:'#3dffa8',charge:.45,side:'call',text:`Holding ${d.qty} shares long`};
  if(d.qty<0)return{status:'IN SHORT',color:'#ff3d71',charge:.45,side:'put',text:`Holding ${-d.qty} shares short`};
  if(S&&!S.market_open)return{status:'CLOSED',color:'#9a96cf',charge:0,side:null,text:'Market closed'};
  if(d.upper&&d.lower){const w=d.upper-d.lower,up=(d.upper-d.price)/w,dn=(d.price-d.lower)/w;
    if(up<.25&&up>=0)return{status:'CHARGING BUY',color:'#3dffa8',charge:.15+.75*(1-up/.25),side:'call',text:`$${(d.upper-d.price).toFixed(2)} below the buy trigger (${d.upper})`};
    if(dn<.25&&dn>=0)return{status:'CHARGING SELL',color:'#ff3d71',charge:.15+.75*(1-dn/.25),side:'put',text:`$${(d.price-d.lower).toFixed(2)} above the sell trigger (${d.lower})`};
    return{status:'SCANNING',color:'#9a96cf',charge:0,side:null,text:`Inside its normal range (${d.lower} – ${d.upper})`}}
  return{status:'SCANNING',color:'#9a96cf',charge:0,side:null,text:'Opening-breakout bot: trades at 9:35 only'};
}
function apply(){
  const t=$('total');t.textContent=money(S.day_pl);t.className='pnl '+(S.day_pl>=0?'up':'dn');
  const age=(Date.now()-new Date(S.updated))/60000,fresh=S.market_open&&age<6,b=$('badge');
  b.textContent=fresh?'LIVE':(S.market_open?'DELAYED':'CLOSED');b.className='badge '+(fresh?'live':'stale');
  $('clock').textContent='Updated '+hhmm(S.updated)+' ET';
  const rows=SYMS.map(s=>({s,v:(S.symbols[s]||{}).pl_day||0})).sort((a,c)=>c.v-a.v);
  $('board').innerHTML=rows.map((r,i)=>`<li data-s="${r.s}"><span class="n">${i+1}</span><span>${r.s}</span><span class="${r.v>=0?'up':'dn'}">${money(r.v)}</span></li>`).join('');
  const F=S.fills||[],ev=F.slice(-10).reverse();
  $('tape').innerHTML=ev.map(e=>`<span>${hhmm(e.ts)} <b>${e.sym}</b> <b class="${e.side==='buy'?'up':'dn'}">${e.side.toUpperCase()} ${e.qty} @ ${e.price.toFixed(2)}</b></span>`).join('')||'<span>No trades yet today</span>';
  const fills=SYMS.reduce((a,s)=>a+((S.symbols[s]||{}).trades||0),0);
  drawLabel(vaultLabel,[['THE VAULT',22,'#ffc94d'],[money(S.day_pl),50,S.day_pl>=0?'#3dffa8':'#ff3d71'],[`${fills} fills · equity $${Math.round(S.equity).toLocaleString()}`,18,'#9a96cf','500']],'#ffc94d');
  SYMS.forEach(s=>{const T=towers[s],d=S.symbols[s]||{},I=info(s);T.target=I.charge;T.side=I.side;T.want=I.side==='call'?CALL:I.side==='put'?PUT:IDLE;
    drawLabel(T.label,[[s,40,'#e9e7ff'],[money(d.pl_day||0),30,(d.pl_day||0)>=0?'#3dffa8':'#ff3d71'],[I.status,17,I.color,'600']],I.color)});
  (S.fills||[]).forEach(e=>{if(seen.has(e.id))return;seen.add(e.id);if(!first&&towers[e.sym]){towers[e.sym].fire=1;towers[e.sym].col.copy(e.side==='buy'?CALL:PUT)}});
  first=false;if(openSym)renderSheet();
}
function renderSheet(){const s=openSym,d=(S&&S.symbols[s])||{},I=info(s);$('sName').textContent=s+' tower';const c=$('sChip');c.textContent=I.status;c.style.color=I.color;
  $('sPnl').textContent=money(d.pl_day||0);$('sPnl').className=(d.pl_day||0)>=0?'up':'dn';$('sQty').textContent=d.qty||0;$('sTrades').textContent=d.trades||0;$('sPx').textContent=d.price?d.price.toFixed(2):'–';
  $('sScan').textContent=I.text+((d.strategies||[]).length?` · strategies: ${d.strategies.join(' + ')}`:'');const m=$('sMeter');m.style.width=Math.round(I.charge*100)+'%';m.style.background=I.side==='put'?'var(--put)':'var(--call)';
  const why={NA:'noise-area',ORB:'opening breakout',exit:'stop/target hit'};
  const items=[...((S&&S.fills)||[]).filter(e=>e.sym===s).map(e=>({ts:e.ts,cls:e.side==='buy'?'up':'dn',txt:`${e.side.toUpperCase()} ${e.qty} @ ${e.price.toFixed(2)} (${why[e.strat]||e.strat})`})),
    ...((S&&S.events)||[]).filter(e=>e.sym===s&&e.event!=='order').map(e=>({ts:e.ts,cls:'',txt:e.event==='orb_signal'?`Opening breakout ${e.dir>0?'LONG':'SHORT'} · stop ${e.stop} · target ${e.target}`:e.event==='na_check'?`Signal: ${['go short','go flat','go long'][e.want+1]} (price ${e.price}, VWAP ${e.vwap})`:e.event}))]
    .sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  $('sLog').innerHTML=items.map(e=>`<li><span class="tm">${hhmm(e.ts)}</span><span class="${e.cls}">${e.txt}</span></li>`).join('')||'<li><span></span><span class="tm">Nothing yet today</span></li>';
  drawChart(d)}
function drawChart(d){const cv=$('chart'),dpr=Math.min(devicePixelRatio,2),W=cv.clientWidth,H=cv.clientHeight;if(!W)return;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const ser=d.series||[];if(ser.length<2)return;const lv=[d.vwap,d.upper,d.lower,d.orb&&+d.orb.stop,d.orb&&+d.orb.target].filter(x=>x&&isFinite(x)&&Math.abs(x/d.price-1)<.012);
  let lo=Math.min(...ser.map(x=>x[1]),...lv),hi=Math.max(...ser.map(x=>x[1]),...lv);const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
  const k0=ser[0][0],k1=ser[ser.length-1][0],R=48,X=k=>4+(k-k0)/Math.max(1,k1-k0)*(W-R-8),Y=p=>H-6-(p-lo)/(hi-lo)*(H-12);
  g.strokeStyle='rgba(120,110,255,.12)';g.fillStyle='#9a96cf';g.font='10px "JetBrains Mono",monospace';for(let i=0;i<=4;i++){const p=lo+(hi-lo)*i/4;g.beginPath();g.moveTo(4,Y(p));g.lineTo(W-R,Y(p));g.stroke();g.fillText(p.toFixed(2),W-R+4,Y(p)+3)}
  const line=(p,c,dash)=>{if(!p||!isFinite(p)||p<lo||p>hi)return;g.setLineDash(dash?[4,4]:[]);g.strokeStyle=c;g.lineWidth=1.4;g.beginPath();g.moveTo(4,Y(p));g.lineTo(W-R,Y(p));g.stroke();g.setLineDash([])};
  line(d.vwap,'#ffc94d');line(d.upper,'#3dffa8',1);line(d.lower,'#ff3d71',1);if(d.orb){line(+d.orb.stop,'#fff',1);line(+d.orb.target,'#fff',1)}
  g.strokeStyle='#e9e7ff';g.lineWidth=1.8;g.beginPath();ser.forEach(([k,p],i)=>i?g.lineTo(X(k),Y(p)):g.moveTo(X(k),Y(p)));g.stroke();
  const [kl,pl]=ser[ser.length-1];g.fillStyle='#e9e7ff';g.beginPath();g.arc(X(kl),Y(pl),3.5,0,7);g.fill();g.fillStyle='#9a96cf';g.fillText(tl(k0),4,H-2)}

/* ---------- data ---------- */
async function poll(){
  try{const r=await fetch(URL_STATE,{headers:{Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(r.status===404){showWait('Waiting for the bot\'s first update. It starts posting once the market opens (9:30 AM ET).');return}
    if(!r.ok)throw new Error(r.status);S=await r.json();$('wait').hidden=true;apply();
  }catch(e){if(!S)showWait('Can\'t reach the bot\'s data right now. Retrying…')}
}
function showWait(t){const w=$('wait');w.textContent=t;w.hidden=false}
poll();setInterval(poll,65000);

/* ---------- interaction & loop ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];controls.autoRotate=false});
canvas.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>8)return;const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);const h=ray.intersectObjects(pick,false)[0];if(h)open(h.object.userData.sym)});
function open(s){openSym=s;$('sheet').classList.add('open');renderSheet()}
$('board').addEventListener('click',e=>{const li=e.target.closest('li');if(li)open(li.dataset.s)});
$('sClose').onclick=()=>{$('sheet').classList.remove('open');openSym=null};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();composer&&composer.setSize(w,h);const f=w<h?40:28;camera.position.set(0,f*.62,f)}
addEventListener('resize',resize);resize();
let last=performance.now(),ph=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;ph+=dt;
  for(const s of SYMS){const T=towers[s];T.charge+=(T.target-T.charge)*Math.min(1,dt*3);if(!T.fire)T.col.lerp(T.want,Math.min(1,dt*3));T.fire=Math.max(0,T.fire-dt*.6);
    const fl=T.target>0&&T.target<.45?.75+.25*Math.sin(ph*(6+T.target*14)):1;T.beam.material.color.copy(T.col);T.beam.material.opacity=Math.min(1,T.charge*fl+T.fire);const sc=1+T.fire*3.5+T.charge*.6;T.beam.scale.set(sc,1,sc);
    T.halo.material.color.copy(T.col);const hs=T.fire>0?1+(1-T.fire)*3:1;T.halo.scale.set(hs,hs,hs);T.halo.material.opacity=T.fire>0?T.fire:T.charge*.8;T.halo.rotation.z+=dt*(1+T.charge*4)}
  controls.update();composer?composer.render():renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
document.fonts&&document.fonts.ready.then(()=>{for(const s of SYMS)towers[s].label.userData.key='';vaultLabel.userData.key='';S&&apply()});
})();
</script></body></html>
